<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eight Ounce Dashboard V4</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-4">

<div class="max-w-6xl mx-auto space-y-6">
<h1 class="text-2xl font-bold">Eight Ounce BI Dashboard V4</h1>

<!-- Summary -->
<div class="grid grid-cols-2 md:grid-cols-5 gap-4">
<div class="bg-white p-4 rounded-xl shadow"><p>Sales</p><h2 id="sales">₱0</h2></div>
<div class="bg-white p-4 rounded-xl shadow"><p>Orders</p><h2 id="orders">0</h2></div>
<div class="bg-white p-4 rounded-xl shadow"><p>AOV</p><h2 id="aov">₱0</h2></div>
<div class="bg-white p-4 rounded-xl shadow"><p>Profit</p><h2 id="profit">₱0</h2></div>
<div class="bg-white p-4 rounded-xl shadow"><p>Margin</p><h2 id="margin">0%</h2></div>
</div>

<!-- Input -->
<div class="bg-white p-4 rounded-xl shadow">
<h2 class="font-bold mb-2">Sales Input</h2>
<table class="w-full text-sm">
<thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Cost</th></tr></thead>
<tbody id="table"></tbody>
</table>
<button onclick="addRow()" class="mt-2 bg-blue-500 text-white px-3 py-1 rounded">Add</button>
</div>

<!-- Expenses + Target -->
<div class="grid md:grid-cols-2 gap-4">
<div class="bg-white p-4 rounded-xl shadow">
<h2 class="font-bold">Expenses</h2>
<input id="expenses" type="number" class="border p-2 w-full">
</div>
<div class="bg-white p-4 rounded-xl shadow">
<h2 class="font-bold">Target</h2>
<input id="target" type="number" class="border p-2 w-full">
<p id="targetText"></p>
</div>
</div>

<!-- Charts -->
<div class="grid md:grid-cols-2 gap-4">
<div class="bg-white p-4 rounded-xl shadow"><canvas id="productChart"></canvas></div>
<div class="bg-white p-4 rounded-xl shadow"><canvas id="historyChart"></canvas></div>
</div>

<!-- Insights -->
<div class="bg-white p-4 rounded-xl shadow">
<h2 class="font-bold">Insights</h2>
<p id="insights"></p>
</div>

<!-- History Table -->
<div class="bg-white p-4 rounded-xl shadow">
<h2 class="font-bold">History</h2>
<table class="w-full text-sm">
<thead><tr><th>Date</th><th>Sales</th><th>Profit</th><th>Margin</th></tr></thead>
<tbody id="historyTable"></tbody>
</table>
</div>

<!-- Buttons -->
<div class="flex gap-2">
<button onclick="calc()" class="bg-black text-white px-4 py-2 rounded">Calculate</button>
<button onclick="saveDay()" class="bg-green-500 text-white px-4 py-2 rounded">Save Day</button>
<button onclick="reset()" class="bg-red-500 text-white px-4 py-2 rounded">Reset</button>
</div>

</div>

<script>
let productChart, historyChart;

function addRow(data={}){
const row=document.createElement('tr');
row.innerHTML=`<td><input value="${data.p||''}" class="border"></td>
<td><input type="number" value="${data.pr||0}" class="border"></td>
<td><input type="number" value="${data.q||0}" class="border"></td>
<td><input type="number" value="${data.c||0}" class="border"></td>`;
document.getElementById('table').appendChild(row);
}

function calc(){
const rows=document.querySelectorAll('#table tr');
let sales=0, orders=0, cost=0;
let labels=[], values=[];
let top='', topQty=0;

rows.forEach(r=>{
const i=r.querySelectorAll('input');
const p=i[0].value;
const pr=+i[1].value;
const q=+i[2].value;
const c=+i[3].value;

const rev=pr*q;
sales+=rev; orders+=q; cost+=c*q;

if(q>topQty){topQty=q; top=p}
if(p){labels.push(p); values.push(q)}
});

const exp=+expenses.value||0;
const profit=sales-cost-exp;
const aov=orders? sales/orders:0;
const margin=sales? (profit/sales)*100:0;

salesEl('sales',sales);
salesEl('orders',orders);
salesEl('aov',aov);
salesEl('profit',profit);
salesEl('margin',margin,'%');

margin<50? marginColor('margin','red'):marginColor('margin','green');

const targetVal=+target.value||0;
const pct=targetVal? (sales/targetVal)*100:0;
targetText.innerText=`${pct.toFixed(0)}% of target`;

let insight='';
if(top) insight+=`Top: ${top}. `;
if(margin<50) insight+='Low margin. ';
if(aov<120) insight+='Increase AOV.';
insights.innerText=insight;

if(productChart) productChart.destroy();
productChart=new Chart(productChartEl(),{type:'bar',data:{labels:labels,datasets:[{data:values}]}});
}

function saveDay(){
calc();
const history=JSON.parse(localStorage.getItem('history')||'[]');
const today=new Date().toLocaleDateString();

history.push({
date:today,
sales:document.getElementById('sales').innerText,
profit:document.getElementById('profit').innerText,
margin:document.getElementById('margin').innerText
});

localStorage.setItem('history',JSON.stringify(history));
renderHistory();
}

function renderHistory(){
const history=JSON.parse(localStorage.getItem('history')||'[]');
const table=document.getElementById('historyTable');
table.innerHTML='';

let labels=[], values=[];

history.forEach(h=>{
const row=`<tr><td>${h.date}</td><td>${h.sales}</td><td>${h.profit}</td><td>${h.margin}</td></tr>`;
table.innerHTML+=row;
labels.push(h.date);
values.push(parseFloat(h.sales.replace('₱','')));
});

if(historyChart) historyChart.destroy();
historyChart=new Chart(historyChartEl(),{type:'line',data:{labels:labels,datasets:[{data:values}]}});
}

function reset(){localStorage.clear(); location.reload();}

function salesEl(id,val,suffix=''){document.getElementById(id).innerText=`₱${val.toFixed?val.toFixed(0):val}${suffix}`}
function marginColor(id,color){document.getElementById(id).className=color==='red'?'text-red-500':'text-green-600'}
function productChartEl(){return document.getElementById('productChart')}
function historyChartEl(){return document.getElementById('historyChart')}

renderHistory();
</script>

</body>
</html>
